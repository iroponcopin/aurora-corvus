<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif" role="img" aria-label="Backrooms objective panel diagram">
<rect x="0" y="0" width="640" height="300" fill="#f6f7fb"/>
<rect x="16" y="16" width="200" height="268" rx="6" fill="#dfe9ea" stroke="#4a5a5a" stroke-width="2" opacity="0.9"/>
<text x="26" y="42" font-size="14" fill="#1a1a1a" font-weight="bold">Objective panel (glass)</text>
<text x="26" y="66" font-size="12" fill="#333">Level 1 — The Lobby</text>
<rect x="26" y="80" width="170" height="10" fill="#c8d6c0"/><rect x="26" y="80" width="120" height="10" fill="#5c9c4a"/>
<text x="26" y="104" font-size="11" fill="#333">Sanity: 71 / 100</text>
<text x="26" y="128" font-size="11" fill="#333">Waypoint: Stairwell ↓</text>
<text x="26" y="152" font-size="11" fill="#333">Task: find the fire exit</text>
<rect x="240" y="16" width="380" height="268" rx="6" fill="#efe6c8" stroke="#a8a06a" stroke-width="2"/>
<text x="260" y="46" font-size="14" fill="#1a1a1a" font-weight="bold">The Lobby (Level 1)</text>
<text x="260" y="72" font-size="12" fill="#333">A real, explorable room set — not a demo box.</text>
<text x="260" y="96" font-size="12" fill="#333">Ordinary weapons: no effect on entities here.</text>
<text x="260" y="120" font-size="12" fill="#333">Entities cannot be defeated — evade, do not fight.</text>
<text x="260" y="144" font-size="12" fill="#333">Thirst is replaced by Sanity as the survival stat.</text>
</svg>
