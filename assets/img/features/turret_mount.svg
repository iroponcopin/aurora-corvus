<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif" role="img" aria-label="Turret mount diagram">
<rect x="0" y="0" width="420" height="320" fill="#f6f7fb"/>
<rect x="150" y="220" width="120" height="60" fill="#555"/>
<rect x="190" y="160" width="40" height="70" fill="#888"/>
<rect x="170" y="120" width="80" height="20" fill="#c0533a"/>
<text x="210" y="300" font-size="12" text-anchor="middle" fill="#333">Turret base</text>
<text x="210" y="60" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Right-click to mount a gun or bow</text>
